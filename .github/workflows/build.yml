name: RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Create a release under this tag (empty, no release)
        type: string
        default: ''
      srpms:
        description: Also build source RPMs
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ENGINE: docker
  BUILD_SRPMS: ${{ inputs.srpms && '1' || '0' }}
  # Bump when the build environment itself changes (base image, toolchain).
  CACHE_VERSION: rpm-v1

jobs:
  # Skia makes the toolkit the long pole; everything else waits for it.
  toolkit:
    name: cutefish-toolkit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Skia revision
        id: skia
        run: |
          rev=$(sed -n 's/^%global skiarev \([0-9a-f]\{40\}\)$/\1/p' specs/cutefish-toolkit.spec)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Cache the Skia source
        uses: actions/cache@v4
        with:
          path: SOURCES
          key: skia-v1-${{ steps.skia.outputs.rev }}
      - name: Cache the built RPMs
        id: rpms
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ env.CACHE_VERSION }}-cutefish-toolkit-${{ hashFiles('specs/cutefish-toolkit.spec', 'scripts/build-one.sh', 'scripts/build-in-container.sh', 'scripts/fetch-sources.sh') }}
      - name: Check the cached RPMs
        if: steps.rpms.outputs.cache-hit == 'true'
        run: compgen -G 'dist/*.rpm' >/dev/null || { echo 'cache hit without RPMs' >&2; exit 1; }
      - name: Build
        if: steps.rpms.outputs.cache-hit != 'true'
        run: bash scripts/build-in-container.sh cutefish-toolkit
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-cutefish-toolkit
          path: dist/*.rpm
          if-no-files-found: error

  # Data packages depend on nothing and run alongside the toolkit.
  data:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - cutefish-icons
          - cutefish-wallpapers
    steps:
      - uses: actions/checkout@v4
      - name: Cache the built RPMs
        id: rpms
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ env.CACHE_VERSION }}-${{ matrix.package }}-${{ hashFiles(format('specs/{0}.spec', matrix.package), format('patches/{0}-*.patch', matrix.package), 'scripts/build-one.sh', 'scripts/build-in-container.sh', 'scripts/fetch-sources.sh') }}
      - name: Check the cached RPMs
        if: steps.rpms.outputs.cache-hit == 'true'
        run: compgen -G 'dist/*.rpm' >/dev/null || { echo 'cache hit without RPMs' >&2; exit 1; }
      - name: Build
        if: steps.rpms.outputs.cache-hit != 'true'
        run: bash scripts/build-in-container.sh ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.package }}
          path: dist/*.rpm
          if-no-files-found: error

  framework:
    name: cutefish-framework
    needs: toolkit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache the built RPMs
        id: rpms
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ env.CACHE_VERSION }}-cutefish-framework-${{ hashFiles('specs/cutefish-framework.spec', 'specs/cutefish-toolkit.spec', 'patches/cutefish-framework-*.patch', 'scripts/build-one.sh', 'scripts/build-in-container.sh', 'scripts/fetch-sources.sh') }}
      - name: Check the cached RPMs
        if: steps.rpms.outputs.cache-hit == 'true'
        run: compgen -G 'dist/*.rpm' >/dev/null || { echo 'cache hit without RPMs' >&2; exit 1; }
      - name: Dependencies from earlier stages
        uses: actions/download-artifact@v4
        with:
          name: rpm-cutefish-toolkit
          path: deps
      - name: Build
        if: steps.rpms.outputs.cache-hit != 'true'
        run: bash scripts/build-in-container.sh cutefish-framework
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-cutefish-framework
          path: dist/*.rpm
          if-no-files-found: error

  # Applications need the toolkit and the framework. They build in parallel.
  apps:
    name: ${{ matrix.package }}
    needs: [toolkit, framework]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - cutefish-core
          - cutefish-filemanager
          - cutefish-terminal
          - xdg-desktop-portal-cutefish
          - cutefish-settings
          - cutefish-compositor
    steps:
      - uses: actions/checkout@v4
      - name: Cache the built RPMs
        id: rpms
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ env.CACHE_VERSION }}-${{ matrix.package }}-${{ hashFiles(format('specs/{0}.spec', matrix.package), 'specs/cutefish-toolkit.spec', 'specs/cutefish-framework.spec', format('patches/{0}-*.patch', matrix.package), 'scripts/build-one.sh', 'scripts/build-in-container.sh', 'scripts/fetch-sources.sh') }}
      - name: Check the cached RPMs
        if: steps.rpms.outputs.cache-hit == 'true'
        run: compgen -G 'dist/*.rpm' >/dev/null || { echo 'cache hit without RPMs' >&2; exit 1; }
      - name: Dependencies from earlier stages
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: deps
      - name: Build
        if: steps.rpms.outputs.cache-hit != 'true'
        run: bash scripts/build-in-container.sh ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.package }}
          path: dist/*.rpm
          if-no-files-found: error

  dm:
    name: cutefish-dm
    needs: toolkit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache the built RPMs
        id: rpms
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ env.CACHE_VERSION }}-cutefish-dm-${{ hashFiles('specs/cutefish-dm.spec', 'specs/cutefish-toolkit.spec', 'patches/cutefish-dm-*.patch', 'scripts/build-one.sh', 'scripts/build-in-container.sh', 'scripts/fetch-sources.sh') }}
      - name: Check the cached RPMs
        if: steps.rpms.outputs.cache-hit == 'true'
        run: compgen -G 'dist/*.rpm' >/dev/null || { echo 'cache hit without RPMs' >&2; exit 1; }
      - name: Dependencies from earlier stages
        uses: actions/download-artifact@v4
        with:
          name: rpm-cutefish-toolkit
          path: deps
      - name: Build
        if: steps.rpms.outputs.cache-hit != 'true'
        run: bash scripts/build-in-container.sh cutefish-dm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-cutefish-dm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Assemble and release
    needs: [apps, data, dm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect the RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: dist
      - name: Upload the combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutefish-rpms
          path: dist/*.rpm
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.rpm
          generate_release_notes: true
